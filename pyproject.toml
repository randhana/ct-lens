# pyproject.toml — single source of truth for packaging, dependencies, and tooling.
#
# ct-lens uses a "src layout" (code lives under ./src) so that tests always run
# against the *installed* package rather than accidentally importing from the
# working directory. Install for development with:  pip install -e ".[dev]"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ct-lens"
version = "0.1.0"
description = "Map the HTTPS certificate landscape of a whole TLD from public Certificate Transparency logs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ct-lens authors" }]
keywords = [
  "certificate-transparency",
  "ct-logs",
  "crtsh",
  "tls",
  "ssl",
  "security",
  "osint",
  "threat-intelligence",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

# Runtime dependencies. Kept deliberately small for the CLI core.
dependencies = [
  "httpx>=0.27",       # modern HTTP client (crt.sh JSON fetch)
  "typer>=0.12",       # type-hint driven CLI framework
  "rich>=13.7",        # pretty tables / progress in the terminal
]

[project.optional-dependencies]
# Heavier analysis/plotting deps are only needed from Phase 3 onwards.
analysis = [
  "cryptography>=43.0",
  "pandas>=2.2",
  "matplotlib>=3.9",
]
# The full-dataset Postgres source (added in Phase 7).
postgres = ["psycopg[binary]>=3.2"]
# Everything needed to develop, lint, type-check, and test.
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "respx>=0.21",         # mock httpx requests so tests never hit the network
  "cryptography>=43.0",  # needed to test (and type-check) the enrichment step
  "matplotlib>=3.9",     # needed to test the charts module
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
]

[project.scripts]
# Installs the `ct-lens` console command -> Typer application object.
ct-lens = "ct_lens.cli.main:app"

[project.urls]
Homepage = "https://github.com/your-org/ct-lens"
Repository = "https://github.com/your-org/ct-lens"
Issues = "https://github.com/your-org/ct-lens/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ct_lens"]

# --------------------------------------------------------------------------- #
# Tooling configuration
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# A pragmatic, strict-but-sane rule set.
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort (import ordering)
  "B",        # flake8-bugbear
  "UP",       # pyupgrade
  "C4",       # flake8-comprehensions
  "SIM",      # flake8-simplify
  "RUF",      # ruff-specific rules
]

[tool.ruff.lint.flake8-bugbear]
# Typer's dependency-injection pattern puts Option()/Argument() in parameter
# defaults by design; this is safe and idiomatic, so exempt them from B008.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src", "tests"]

# psycopg is an optional dependency (the 'postgres' extra); it may be absent in
# dev/CI environments, so don't fail type-checking on its import.
[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
