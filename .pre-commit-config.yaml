# Pre-commit hooks — run `pre-commit install` once to enable.
# These mirror the CI quality gates so problems are caught before pushing.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff           # lint
        args: [--fix]
      - id: ruff-format    # format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
